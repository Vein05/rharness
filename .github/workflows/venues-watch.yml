name: venues-watch
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
permissions:
  issues: write
  contents: read
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: watch
        run: python scripts/venues-watch.py > watch.txt 2>&1
        continue-on-error: true
      - run: cat watch.txt
        if: always()
      - if: steps.watch.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="venue source page changed ($(date -u +%F))"
          body="$(cat watch.txt)

          Review the page, update venue.json and its revision date, then run scripts/venues-watch.py --update."
          open=$(gh issue list --state open --search "venue source page changed" --json number --jq length)
          if [ "$open" -eq 0 ]; then
            gh issue create --title "$title" --body "$body"
          else
            number=$(gh issue list --state open --search "venue source page changed" --json number --jq 'max_by(.number).number')
            gh issue comment "$number" --body "$body"
          fi
